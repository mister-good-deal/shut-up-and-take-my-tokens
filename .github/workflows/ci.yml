name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The tests run the command through every shell they find, and the page promises bash and zsh.
      - run: sudo apt-get install -y zsh
      - run: npm test
